services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - '127.0.0.1:27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '8787'
      HOST: 0.0.0.0
      DATA_DIR: /data
      CLIENT_DIR: /app/dist/client
      MONGODB_URI: mongodb://mongo:27017/dota
    volumes:
      - .:/data
    ports:
      - '8787:8787'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/api/health').then((response) => { if (response.ok) process.exit(0); process.exit(1); }).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ['quick']
    entrypoint: ['cloudflared']
    command: ['tunnel', '--no-autoupdate', '--url', 'http://app:8787']
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  tunnel-named:
    image: cloudflare/cloudflared:latest
    profiles: ['named']
    entrypoint: ['cloudflared']
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    profiles: ['ngrok']
    command: ['http', 'http://app:8787', '--log', 'stdout']
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - '127.0.0.1:4040:4040'
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
